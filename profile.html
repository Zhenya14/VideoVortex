<script>
  document.addEventListener("DOMContentLoaded", () => {
    const logo = document.getElementById("logo");
    const logoText = document.getElementById("logo-text");
    if (!logo || !logoText) return;

    const today = new Date();
    const month = today.getMonth() + 1;
    const day = today.getDate();

    const originalLogoSrc = logo.src;

    const isNewYearPeriod =
        (month === 12 && day >= 15) ||
        (month === 1 && day <= 25);

    const isVyshyvanka =
        month === 5 && day === 16;

    const isIndependenceDay = month === 8 && (day === 23 || day === 24);

    // ---------- НОВИЙ РІК ----------
    if (isNewYearPeriod) {
        logo.src = "VideoVortex_new_year's_logo.jpg";
    }

    // ---------- ДЕНЬ ВИШИВАНКИ ----------
    if (isVyshyvanka) {
        logo.src = "VideoVortex_logo_embriodery.jpg";
        styleButtons("#8B0000", "#1C1C1C");
        applyIcons(vyshyvankaIcons);
    }

    // ---------- ДЕНЬ НЕЗАЛЕЖНОСТІ ----------
    if (isIndependenceDay) {
        logo.src = "VideoVortex_logo_indepedence.jpg";
        logoText.textContent = "VideoVortex 💙💛";
        styleButtons("#0057B7", "#FFDD00");
    }

    // ---------- СНІГ ----------
    if (month === 1 && day === 1) {
        startSnow();
    }

    // ---------- ПОТРІЙНИЙ КЛІК ----------
    logo.addEventListener("click", () => {
        logoClickCount++;

        if (logoClickCount === 1) {
            logoClickTimer = setTimeout(() => {
                logoClickCount = 0;
            }, 1200);
        }

        if (logoClickCount === 3) {
            clearTimeout(logoClickTimer);
            logoClickCount = 0;
            launchNewYearEasterEgg();
        }
    });
});
</script>
<script>
function openTab(evt, tabName) {
  const tabcontent = document.getElementsByClassName("tabcontent");
  for (let i=0;i<tabcontent.length;i++) tabcontent[i].style.display="none";
  const tablinks = document.getElementsByClassName("tab-button-liquid-glass");
  for (let i=0;i<tablinks.length;i++) tablinks[i].classList.remove("active");
  document.getElementById(tabName).style.display="block";
  evt.currentTarget.classList.add("active");
}

document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("defaultOpen").click();
});
</script>

function sanitizeHTML(str) {

async function isUserBlockedByMe(targetUid) {

  const me = firebase.auth().currentUser;

  if (!me) return false;
  if (!targetUid) return false;

  try {

    const snap = await database
      .ref(`users/${me.uid}/blockedUsers/${targetUid}`)
      .once("value");

    return snap.exists();

  } catch {

    return false;

  }

}

function clearFeedCache() {
  Object.keys(localStorage)
    .filter(k => k.startsWith("video_cache_"))
    .forEach(k => localStorage.removeItem(k));
}

async function didUserBlockMe(targetUid) {

  const me = firebase.auth().currentUser;

  if (!me) return false;
  if (!targetUid) return false;

  try {

    const snap = await database
      .ref(`users/${targetUid}/blockedUsers/${me.uid}`)
      .once("value");

    const isBlocked = snap.exists();

    if (isBlocked) {
      clearFeedCache(); // 👈 ОЦЕ ТІЛЬКИ ТУТ
    }

    return isBlocked;

  } catch {
    return false;
  }
}

function getInitials(name) {
  if (!name) return "?";

  const parts = name.trim().split(" ");

  if (parts.length === 1) return parts[0][0].toUpperCase();

  return (parts[0][0] + parts[1][0]).toUpperCase();
}

let isHiddenAccount = false;
let nameAccount = "";

async function loadProfile() {
  try {
    const snapModeration = await database.ref(`moderation/users/${blockedUserUid}`).once("value");
    const dataModeration = snapModeration.val() || {};

    const snap = await database.ref(`users/${blockedUserUid}`).once("value");
    const data = snap.val();

    // ❌ NOT EXISTS
    if (!snap.exists()) {
      avatar.style.backgroundImage = "";
      avatar.textContent = "?";
      userName.textContent = "Невідомий користувач";
      isHiddenAccount = true;
      return;
    }

    // ❌ BLOCK CHECK
    if (blockedUserUid) {
      const blockedMeProfile = await didUserBlockMe(blockedUserUid);

      if (blockedMeProfile) {
        avatar.style.backgroundImage = "";
        avatar.textContent = "❌";
        userName.textContent = "Акаунт не знайдено";
        userName.setAttribute("data-i18n", "account-not-found");
        applyTranslations();
        isHiddenAccount = true;
        return;
      }
    }

    const isFrozen = dataModeration.status === "frozen_soft";

    // ======================
    // NAME
    // ======================
    const name = `${data.name || "Користувач"} ${data.supername || ""}`.trim();
const verifiedBadge = `${data.owner === true && data.verifiedBadge ? `<img class='adaptive-stroke' src='${data.verifiedBadge}'>`
        : ""}`;
    userName.innerHTML = isFrozen ? "❄️ Видалений акаунт" : sanitizeHTML(name) + verifiedBadge;
    nameAccount = name;

    if (isFrozen) {
      userName.setAttribute("data-i18n", "account-frozen");
      applyTranslations();
    }

    // ======================
    // AVATAR
    // ======================
    if (isFrozen) {
      avatar.style.backgroundImage = "";
      avatar.style.background = data.color || "#ccc";
      avatar.textContent = "👻";
    } else if (data.avatarId) {
      try {
        const url = await firebase
          .storage()
          .ref(`avatars/${data.avatarId}.webp`)
          .getDownloadURL();

        avatar.style.backgroundImage = `url(${url})`;
        avatar.style.backgroundSize = "cover";
        avatar.style.backgroundPosition = "center";
        avatar.textContent = "";
      } catch (e) {
        avatar.style.backgroundImage = "";
        avatar.style.background = data.color || "#ccc";
        avatar.textContent = getInitials(name);
      }
    } else {
      avatar.style.backgroundImage = "";
      avatar.style.background = data.color || "#ccc";
      avatar.textContent = getInitials(name);
    }

    // ======================
    // WALLPAPER
    // ======================
    if (!data.wallpaperId) {
      backgroundProfile.style.backgroundImage = "";
    } else {
      try {
        const urlWallpaper = await firebase
          .storage()
          .ref(`wallpapers/${data.wallpaperId}.webp`)
          .getDownloadURL();

        backgroundProfile.style.backgroundImage = `url(${urlWallpaper})`;
        backgroundProfile.style.backgroundSize = "cover";
        backgroundProfile.style.backgroundPosition = "center";
      } catch (e) {
        backgroundProfile.style.backgroundImage = "";
      }
    }

  } catch (e) {
    console.error("loadProfile error:", e);

    if (!isHiddenAccount) {
      avatar.style.backgroundImage = "";
      avatar.textContent = "⚠️";
      userName.textContent = "Помилка завантаження " + e.message;
    }
  }
}
async function loadVideos() {
  const videoGallery = document.getElementById("video-gallery");
  videoGallery.innerHTML = "";

  const snapshot = await firebase.database().ref("videos").once("value");

  if (!snapshot.exists() || !blockedUserUid) {
    videoGallery.innerHTML = "<h3>🎬 Публікації відсутні</h3>";
    return;
  }

  const videos = [];
  snapshot.forEach(child => {
    const v = child.val();
    if (v) videos.push({ key: child.key, ...v });
  });

  const filtered = [];

  for (const v of videos) {
    if (!v.authorUid) continue;

    if (blockedUserUid && v.authorUid !== blockedUserUid) continue;

    const blockedMe = await didUserBlockMe(v.authorUid);
    if (blockedMe) continue;
    filtered.push(v);
  }

  if (filtered.length === 0) {
    videoGallery.innerHTML = "<h3>🎬 Публікації відсутні</h3>";
    return;
  }

  for (const v of filtered) {
    const container = document.createElement("div");
    container.className = "video";

    const img = document.createElement("img");
    img.src = v.thumbnail || "default.jpg";

    if (v.nsfw) img.style.filter = "blur(30px)";

    img.onclick = () => {
      location.href = `video.html?key=${v.key}`;
    };
const title = document.createElement("span");
    title.src = v.title;

async function confirmBlockUser() {
    const currentUser = firebase.auth().currentUser;
    if (!currentUser) return;

    if (!blockedUserUid) {
        alert("Не вдалося визначити користувача");
        return;
    }

    if (currentUser.uid === blockedUserUid) {
        alert("Не можна заблокувати самого себе");
        return;
    }

    await firebase.database()
      .ref(`users/${currentUser.uid}/blockedUsers/${blockedUserUid}`)
      .set({
          blocked: true,
          uid: blockedUserUid,
          userName: realBlockedUserName
      });

    closeBlockModal();
    alert("Користувача заблоковано");
}

async function loadPosts() {
  const photoGallery = document.getElementById("photo-gallery");
  photoGallery.innerHTML = "";

  const snapshot = await firebase.database().ref("photos").once("value");

  if (!snapshot.exists() || !blockedUserUid) {
    photoGallery.innerHTML = "<h3>📭 Немає дописів</h3>";
    return;
  }

  const posts = [];
  snapshot.forEach(child => {
    const p = child.val();
    if (p) posts.push({ key: child.key, ...p });
  });

  const filtered = [];

  for (const p of posts) {
    if (!p.authorUid) continue;

    if (blockedUserUid && p.authorUid !== blockedUserUid) continue;

    const blockedMe = await didUserBlockMe(p.authorUid);
    if (blockedMe) continue;

    filtered.push(p);
  }

  if (filtered.length === 0) {
    photoGallery.innerHTML = "<h3>📭 Немає дописів</h3>";
    return;
  }

  for (const p of filtered) {
    const container = document.createElement("div");
    container.className = "post";

    const img = document.createElement("img");
    img.src = p.url || "default.jpg";

    container.appendChild(img);

    const title = document.createElement("div");
    title.textContent = p.title || "(Порожній допис)";
    container.appendChild(title);

    photoGallery.appendChild(container);
  }
}
async function loadReposts() {
  const repostsGallery = document.getElementById("repost-gallery");
  const repostsSection = document.getElementById("reposts");
  const repostButton = document.getElementById("repost");

  if (!repostsGallery || !repostsSection || !repostButton || !blockedUserUid) {
    return;
  }

  repostsGallery.innerHTML = "";

  try {
    const blockedMe = await didUserBlockMe(blockedUserUid);

    if (blockedMe) {
      repostButton.style.display = "none";
      repostsSection.style.display = "none";
      return;
  }
    const snapshot = await firebase
      .database()
      .ref("reposts/" + blockedUserUid)
      .once("value");

    // Репостів немає
    if (!snapshot.exists()) {
      repostButton.style.display = "none";
      repostsSection.style.display = "none";
      return;
    }

    let hasReposts = false;

    snapshot.forEach(child => {
      const r = child.val();

      if (!r) {
        return;
      }

      // Перевіряємо, що є videoKey
      if (!r.videoKey) {
        return;
      }

      hasReposts = true;

      const container = document.createElement("div");
      container.className = "video";

      const img = document.createElement("img");

      img.src = r.thumbnail || "default.jpg";
      img.alt = r.title || "Репост";

      img.onclick = () => {
        location.href = `video.html?key=${r.videoKey}`;
      };

      const title = document.createElement("span");
      title.textContent = r.title || "Без назви";

      container.appendChild(img);
      container.appendChild(title);

      repostsGallery.appendChild(container);
    });

    // Якщо немає жодного нормального репоста
    if (!hasReposts) {
      repostButton.style.display = "none";
      repostsSection.style.display = "none";
      return;
    }

    // Є репости
    repostButton.style.display = "";
    repostsSection.style.display = "";

  } catch (error) {
    console.error("❌ Помилка завантаження репостів:", error);

    repostButton.style.display = "none";
    repostsSection.style.display = "none";
  }
}
